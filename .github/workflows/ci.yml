name: ci

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

      - name: No C toolchain dependencies
        # aws-lc-rs needs CMake and NASM, and openssl-sys needs a system OpenSSL. Both
        # break the client's cross-platform build, and the client compiles the proto
        # crate from here - so this is guarded on both sides, not just in the app.
        run: |
          if cargo tree --workspace --prefix none | grep -iE '^(aws-lc|openssl-sys)'; then
            echo "::error::a C-toolchain crate entered the dependency graph"
            exit 1
          fi

  # The proto crate is compiled by the Remotier client as well as by this server. A
  # change that builds here and not there is the drift the shared crate exists to
  # prevent, so its own test suite runs in isolation too.
  proto:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p remotier-sync-proto

  compose:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Compose files parse
        run: |
          docker compose -f docker-compose.yml config >/dev/null
          POSTGRES_PASSWORD=ci docker compose \
            -f docker-compose.yml -f docker-compose.postgres.yml config >/dev/null
